name: podhod
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/postgres_password:/run/secrets/postgres_password:ro
      - ./secrets/init_app_db_password:/run/secrets/init_app_db_password:ro
      - ./secrets/init_keycloak_db_password:/run/secrets/init_keycloak_db_password:ro
      - ./app/deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-podhod.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    networks: [database]
  keycloak:
    build:
      context: ./app
      dockerfile: deploy/keycloak.Dockerfile
    restart: unless-stopped
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        export KC_DB_PASSWORD="$$(</run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(</run/secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_BASE_URL}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: podhod-admin
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx512m'
    volumes:
      - ./secrets/keycloak_db_password:/run/secrets/keycloak_db_password:ro
      - ./secrets/keycloak_admin_password:/run/secrets/keycloak_admin_password:ro
      - ./secrets/realm.json:/opt/keycloak/data/import/podhod-realm.json:ro
    ports: ['127.0.0.1:8088:8080']
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /auth/realms/podhod/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$${status}" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    networks: [database, edge]
  api:
    build: ./app
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OIDC_ISSUER: ${PUBLIC_BASE_URL}/auth/realms/podhod
      DATABASE_URL_FILE: /run/secrets/database_url
    volumes:
      - ./secrets/database_url:/run/secrets/database_url:ro
    ports: ['127.0.0.1:8087:8080']
    depends_on:
      db: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=16m,noexec,nosuid']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [database, edge]
volumes:
  postgres_data:
networks:
  database: {internal: true}
  edge:
